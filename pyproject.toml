[project]
name = "rag-eval-lab"
version = "0.1.0"
description = "Measure how chunking, retrieval and re-ranking choices change RAG answer quality on a fixed eval set."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Smit Sohagiya" }]
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "typer>=0.12",
]

[project.scripts]
rag-eval-lab = "rag_eval_lab.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PTH", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q --cov=rag_eval_lab --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["rag_eval_lab"]
